<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi Tools Web</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      background:#050816;
      overflow-x:hidden;
    }

    .glass{
      background:rgba(255,255,255,.05);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.08);
    }

    .glow{
      box-shadow:0 0 30px rgba(0,255,255,.15);
    }

    .card-hover{
      transition:.3s ease;
    }

    .card-hover:hover{
      transform:translateY(-5px);
      box-shadow:0 0 35px rgba(0,255,255,.18);
    }

    .loader{
      width:25px;
      height:25px;
      border:3px solid #fff;
      border-bottom-color:transparent;
      border-radius:50%;
      display:inline-block;
      animation:rotation 1s linear infinite;
    }

    @keyframes rotation {
      0%{ transform:rotate(0deg); }
      100%{ transform:rotate(360deg); }
    }

    .hidden{
      display:none;
    }
  </style>
</head>

<body class="text-white min-h-screen">

  <div class="max-w-7xl mx-auto px-5 py-10">

    <div class="text-center mb-12">
      <h1 class="text-5xl font-black bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
        MULTI TOOLS WEB
      </h1>

      <p class="text-zinc-400 mt-4">
        HD Image • TikTok Downloader • YTMP3 • Upload To URL
      </p>
    </div>

    <div class="grid lg:grid-cols-2 gap-7">

      <!-- HD IMAGE -->
      <div class="glass glow rounded-3xl p-6 card-hover">
        <h2 class="text-2xl font-bold mb-5">
          🖼 HD Image
        </h2>

        <input
          type="file"
          id="hdFile"
          class="w-full bg-zinc-900 rounded-xl p-4 border border-zinc-700"
        />

        <button
          onclick="hdImage()"
          class="w-full mt-5 bg-cyan-500 hover:bg-cyan-600 transition rounded-xl py-4 font-bold"
        >
          Enhance Image
        </button>

        <div id="hdLoading" class="mt-5 hidden text-center">
          <span class="loader"></span>
        </div>

        <div id="hdResult" class="mt-5"></div>
      </div>

      <!-- TIKTOK -->
      <div class="glass glow rounded-3xl p-6 card-hover">
        <h2 class="text-2xl font-bold mb-5">
          🎵 TikTok Downloader
        </h2>

        <input
          type="text"
          id="ttUrl"
          placeholder="https://vt.tiktok.com/..."
          class="w-full bg-zinc-900 rounded-xl p-4 border border-zinc-700 outline-none"
        />

        <button
          onclick="downloadTikTok()"
          class="w-full mt-5 bg-pink-500 hover:bg-pink-600 transition rounded-xl py-4 font-bold"
        >
          Download TikTok
        </button>

        <div id="ttLoading" class="mt-5 hidden text-center">
          <span class="loader"></span>
        </div>

        <div id="ttResult" class="mt-5"></div>
      </div>

      <!-- YTMP3 -->
      <div class="glass glow rounded-3xl p-6 card-hover">
        <h2 class="text-2xl font-bold mb-5">
          🎧 YTMP3 Downloader
        </h2>

        <input
          type="text"
          id="ytUrl"
          placeholder="https://youtube.com/watch?v="
          class="w-full bg-zinc-900 rounded-xl p-4 border border-zinc-700 outline-none"
        />

        <button
          onclick="downloadYT()"
          class="w-full mt-5 bg-red-500 hover:bg-red-600 transition rounded-xl py-4 font-bold"
        >
          Convert MP3
        </button>

        <div id="ytLoading" class="mt-5 hidden text-center">
          <span class="loader"></span>
        </div>

        <div id="ytResult" class="mt-5"></div>
      </div>

      <!-- TO URL -->
      <div class="glass glow rounded-3xl p-6 card-hover">
        <h2 class="text-2xl font-bold mb-5">
          🔗 Upload To URL
        </h2>

        <input
          type="file"
          id="urlFile"
          class="w-full bg-zinc-900 rounded-xl p-4 border border-zinc-700"
        />

        <button
          onclick="uploadUrl()"
          class="w-full mt-5 bg-green-500 hover:bg-green-600 transition rounded-xl py-4 font-bold"
        >
          Upload File
        </button>

        <div id="urlLoading" class="mt-5 hidden text-center">
          <span class="loader"></span>
        </div>

        <div id="urlResult" class="mt-5"></div>
      </div>

    </div>

  </div>

<script>

const API = {
  hd: "/api/hd",
  tiktok: "/api/tiktok",
  ytmp3: "/api/ytmp3",
  tourl: "/api/tourl"
}

async function hdImage(){

  const file = document.getElementById("hdFile").files[0]

  if(!file) return alert("Upload gambar dulu")

  const form = new FormData()
  form.append("file", file)

  document.getElementById("hdLoading").classList.remove("hidden")
  document.getElementById("hdResult").innerHTML = ""

  try{

    const req = await fetch(API.hd,{
      method:"POST",
      body:form
    })

    const res = await req.json()

    document.getElementById("hdResult").innerHTML = `
      <img src="${res.result}" class="rounded-2xl w-full"/>
      <a href="${res.result}" target="_blank"
      class="block mt-4 bg-cyan-500 text-center py-3 rounded-xl font-bold">
      Download HD
      </a>
    `

  }catch(err){
    alert("Error HD")
  }

  document.getElementById("hdLoading").classList.add("hidden")
}

async function downloadTikTok(){

  const url = document.getElementById("ttUrl").value

  if(!url) return alert("Masukkan URL TikTok")

  document.getElementById("ttLoading").classList.remove("hidden")
  document.getElementById("ttResult").innerHTML = ""

  try{

    const req = await fetch(API.tiktok,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({url})
    })

    const res = await req.json()

    document.getElementById("ttResult").innerHTML = `
      <video controls class="rounded-2xl w-full">
        <source src="${res.video}">
      </video>

      <a href="${res.video}" target="_blank"
      class="block mt-4 bg-pink-500 text-center py-3 rounded-xl font-bold">
      Download Video
      </a>
    `

  }catch(err){
    alert("Error TikTok")
  }

  document.getElementById("ttLoading").classList.add("hidden")
}

async function downloadYT(){

  const url = document.getElementById("ytUrl").value

  if(!url) return alert("Masukkan URL YouTube")

  document.getElementById("ytLoading").classList.remove("hidden")
  document.getElementById("ytResult").innerHTML = ""

  try{

    const req = await fetch(API.ytmp3,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({url})
    })

    const res = await req.json()

    document.getElementById("ytResult").innerHTML = `
      <audio controls class="w-full">
        <source src="${res.audio}">
      </audio>

      <a href="${res.audio}" target="_blank"
      class="block mt-4 bg-red-500 text-center py-3 rounded-xl font-bold">
      Download MP3
      </a>
    `

  }catch(err){
    alert("Error YTMP3")
  }

  document.getElementById("ytLoading").classList.add("hidden")
}

async function uploadUrl(){

  const file = document.getElementById("urlFile").files[0]

  if(!file) return alert("Upload file dulu")

  const form = new FormData()
  form.append("file", file)

  document.getElementById("urlLoading").classList.remove("hidden")
  document.getElementById("urlResult").innerHTML = ""

  try{

    const req = await fetch(API.tourl,{
      method:"POST",
      body:form
    })

    const res = await req.json()

    let html = ""

    res.result.forEach(item => {

      html += `
        <div class="bg-zinc-900 rounded-2xl p-4 mt-4 border border-zinc-800">
          <div class="font-bold text-lg">${item.host}</div>

          <a
            href="${item.url}"
            target="_blank"
            class="text-cyan-400 break-all"
          >
            ${item.url}
          </a>
        </div>
      `
    })

    document.getElementById("urlResult").innerHTML = html

  }catch(err){
    alert("Error Upload")
  }

  document.getElementById("urlLoading").classList.add("hidden")
}

</script>

</body>
</html>
